name: Build Windows exe

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    strategy:
      fail-fast: false          # if one build has a problem, the other still finishes
      matrix:
        include:
          # Windows 10 / 11  - PyQt6, looks 100% identical to the Linux version
          - suffix: Win10-11
            python: "3.12"
            qt: "PyQt6"
          # Windows 8.1 (also runs on 10 / 11) - PyQt5, nearly identical look
          - suffix: Win8.1
            python: "3.9"
            qt: "PyQt5==5.15.11"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          architecture: x64

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "${{ matrix.qt }}" pyinstaller

      - name: Build MFocus.exe
        run: >
          pyinstaller --noconfirm --clean --onefile --windowed
          --name MFocus
          --icon mfocus.ico
          --add-data "mfocus.png;."
          --add-data "fonts;fonts"
          main.py

      - name: Smoke test (opens the window once, checks the Inter font, then quits)
        continue-on-error: true
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "dist\MFocus.exe" -ArgumentList "--selftest","selftest.txt" -Wait -PassThru
          if (Test-Path selftest.txt) { Get-Content selftest.txt }
          if ($p.ExitCode -ne 0) { throw "Self-test failed (exit code $($p.ExitCode))" }

      - name: Name the file
        shell: pwsh
        run: Copy-Item dist\MFocus.exe "dist\MFocus-${{ matrix.suffix }}.exe"

      - uses: actions/upload-artifact@v4
        with:
          name: MFocus-${{ matrix.suffix }}
          path: dist/MFocus-${{ matrix.suffix }}.exe

      - name: Attach to release (only when you push a tag like v1.0)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/MFocus-${{ matrix.suffix }}.exe
